    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --check-done: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.4rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-pills {
            display: flex;
            gap: 0.75rem;
        }

        .stat-badge {
            background: #090d16;
            border: 1px solid var(--panel-border);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-badge strong {
            color: var(--accent);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 340px;
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .search-input, select {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus, select:focus {
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
        }

        .checkbox-item input {
            cursor: pointer;
            accent-color: var(--accent);
        }

        /* Main Workspace */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-bar {
            background: #090d16;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--panel);
            color: var(--accent);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Checklist Styles */
        .step-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: border-color 0.15s ease;
        }

        .step-card.completed {
            border-color: var(--check-done);
            background: #064e3b15;
        }

        .step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .step-title {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .step-cat {
            background: #334155;
            color: #cbd5e1;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .warp-badge {
            background: #4c1d95;
            color: #c084fc;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .scans-box {
            background: #1e1b4b;
            border: 1px solid #3730a3;
            color: #c7d2fe;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .aspect-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.3rem;
        }

        .aspect-pill {
            background: #090d16;
            border: 1px solid var(--panel-border);
            color: #e2e8f0;
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 600;
        }

        .aspect-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            vertical-align: middle;
        }

        /* Diagram View */
        #diagram-wrapper {
            width: 100%;
            height: 100%;
            min-height: 600px;
            background: #090d16;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            position: relative;
            overflow: hidden;
        }

        #mermaid-output {
            width: 100%;
            height: 100%;
        }

        #mermaid-output svg {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

            </div>
        </div>
    </div>

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { curve: 'basis' }
        });

        let activeTargetKey = 'FOCUS_SHADOWBEAM';
        let panZoomInstance = null;
        let diagramNeedsRender = true;
        let currentChain = [];

        const unlockedState = JSON.parse(localStorage.getItem('tc_unlocked_nodes') || '{}');

        // Populate dropdown
        const targetSelect = document.getElementById('target-select');
        const searchInput = document.getElementById('search-input');
        const chkParentsOnly = document.getElementById('chk-parents-only');
        const chkHideDone = document.getElementById('chk-hide-done');

        function populateSelect(filterQuery = '') {
            const currentVal = targetSelect.value || activeTargetKey;
            const sortedNodes = Object.values(RESEARCH_DB).sort((a,b) => a.name.localeCompare(b.name));
            
            const filtered = filterQuery
                ? sortedNodes.filter(n => n.name.toLowerCase().includes(filterQuery) || n.key.toLowerCase().includes(filterQuery))
                : sortedNodes;

            targetSelect.innerHTML = filtered.map(n => `<option value="${n.key}">${n.name} [${n.category}]</option>`).join('');
            if (filtered.some(n => n.key === currentVal)) {
                targetSelect.value = currentVal;
            } else if (filtered.length > 0) {
                targetSelect.value = filtered[0].key;
            }
        }

        populateSelect();

        function getAspectBadge(aspectName) {
            const key = aspectName.toLowerCase().trim();
            const iconUrl = ASPECT_ICONS[key];
            if (iconUrl) {
                return `<span class="aspect-pill"><img src="${iconUrl}" class="aspect-icon" alt="${aspectName}">${aspectName}</span>`;
            }
            return `<span class="aspect-pill">✨ ${aspectName}</span>`;
        }

        function renderAspectList(aspectStr) {
            if (!aspectStr || aspectStr === 'None') return 'None';
            const parts = aspectStr.split(',').map(s => s.trim()).filter(Boolean);
            return `<div class="aspect-badge-container">${parts.map(getAspectBadge).join('')}</div>`;
        }

        function sanitizeId(key) {
            let clean = key.replace(/[^A-Za-z0-9_]/g, '_');
            if (clean && /^\d/.test(clean)) clean = 'n_' + clean;
            return clean;
        }

        function resolvePrereqs(targetKey, visited = new Set(), directParentsOnly = false) {
            if (visited.has(targetKey)) return [];
            visited.add(targetKey);

            const entry = RESEARCH_DB[targetKey];
            if (!entry) return [];

            if (directParentsOnly) {
                const list = [...(entry.parents || []), targetKey];
                return list.filter(k => RESEARCH_DB[k]);
            }

            let chain = [];
            for (const p of entry.parents || []) {
                if (RESEARCH_DB[p]) {
                    chain.push(...resolvePrereqs(p, new Set(visited), false));
                }
            }
            chain.push(targetKey);

            const dedup = [];
            const seen = new Set();
            for (const k of chain) {
                if (!seen.has(k)) {
                    seen.add(k);
                    dedup.push(k);
                }
            }
            return dedup;
        }

        function toggleNodeCheck(nodeKey) {
            unlockedState[nodeKey] = !unlockedState[nodeKey];
            localStorage.setItem('tc_unlocked_nodes', JSON.stringify(unlockedState));
            renderTarget();
        }

        function attachPanZoom() {
            const outputDiv = document.getElementById('mermaid-output');
            const svgElem = outputDiv.querySelector('svg');
            const wrapper = document.getElementById('diagram-wrapper');

            if (svgElem && wrapper && wrapper.clientWidth > 0 && wrapper.clientHeight > 0) {
                if (panZoomInstance) {
                    try { panZoomInstance.destroy(); } catch(e) {}
                    panZoomInstance = null;
                }
                try {
                    panZoomInstance = svgPanZoom(svgElem, {
                        zoomEnabled: true,
                        controlIconsEnabled: true,
                        fit: true,
                        center: true,
                        minZoom: 0.2,
                        maxZoom: 10
                    });
                } catch (err) {
                    console.warn("svgPanZoom deferred:", err.message);
                }
            }
        }

        async function renderMermaid(chain) {
            const outputDiv = document.getElementById('mermaid-output');
            outputDiv.innerHTML = '<div style="padding:2rem; color:var(--text-muted); text-align:center;">Building graph structure...</div>';

            const catColors = [
                ["#4a148c", "#ab47bc"], ["#1a237e", "#5c6bc0"], ["#004d40", "#26a69a"], 
                ["#b71c1c", "#ef5350"], ["#e65100", "#ff9800"], ["#33691e", "#8bc34a"], 
                ["#880e4f", "#ec407a"], ["#006064", "#00bcd4"]
            ];

            const catMap = {};
            const classDefs = [];
            const categories = {};

            chain.forEach(nodeKey => {
                const node = RESEARCH_DB[nodeKey] || { name: nodeKey, category: 'General' };
                const cat = node.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(nodeKey);

                if (!catMap[cat]) {
                    const idx = Object.keys(catMap).length % catColors.length;
                    const [fill, stroke] = catColors[idx];
                    const clsId = `cat_${idx}`;
                    catMap[cat] = clsId;
                    classDefs.push(`    classDef ${clsId} fill:${fill},stroke:${stroke},color:#fff,stroke-width:2px;`);
                }
            });

            let graphStr = "flowchart TD\n";

            for (const [cat, nodes] of Object.entries(categories)) {
                const catId = sanitizeId(cat);
                graphStr += `    subgraph ${catId} ["${cat} Tab"]\n`;
                nodes.forEach(n => {
                    const nId = sanitizeId(n);
                    const cleanName = (RESEARCH_DB[n]?.name || n).replace(/"/g, "'");
                    graphStr += `        ${nId}["${cleanName}"]\n`;
                });
                graphStr += "    end\n\n";
            }

            const addedEdges = new Set();
            chain.forEach(n => {
                const node = RESEARCH_DB[n];
                if (!node) return;
                const nId = sanitizeId(n);
                (node.parents || []).forEach(p => {
                    if (chain.includes(p) && p !== n) {
                        const pId = sanitizeId(p);
                        const edge = `${pId}_${nId}`;
                        if (!addedEdges.has(edge)) {
                            addedEdges.add(edge);
                            graphStr += `    ${pId} --> ${nId}\n`;
                        }
                    }
                });
            });

            for (const [cat, nodes] of Object.entries(categories)) {
                const clsName = catMap[cat];
                const nodeIds = nodes.map(n => sanitizeId(n)).join(',');
                graphStr += `    class ${nodeIds} ${clsName};
`;
            }

            graphStr += classDefs.join("\n");

            try {
                const { svg } = await mermaid.render('mermaid-svg-element', graphStr);
                outputDiv.innerHTML = svg;
                diagramNeedsRender = false;
                attachPanZoom();
            } catch (err) {
                console.error("Mermaid render error:", err);
                outputDiv.innerHTML = `<div style="padding:2rem; color:#ef4444;">Error rendering diagram: ${err.message}</div>`;
            }
        }

        function renderTarget() {
            const key = targetSelect.value || activeTargetKey;
            activeTargetKey = key;
            const parentsOnly = chkParentsOnly.checked;
            const hideDone = chkHideDone.checked;

            currentChain = resolvePrereqs(key, new Set(), parentsOnly);

            // Calculate Total Cumulative Path Warp
            let totalPathWarp = 0;
            currentChain.forEach(k => {
                const w = parseInt(RESEARCH_DB[k]?.warp || '0') || 0;
                totalPathWarp += w;
            });

            const totalWarpElem = document.getElementById('stat-total-warp');
            if (totalWarpElem) {
                totalWarpElem.innerHTML = `Total Path Warp: <strong style="color:#c084fc;">💜 ${totalPathWarp} Warp</strong>`;
            }

            // Render Checklist
            const checklistContainer = document.getElementById('checklist-container');
            const displayChain = hideDone ? currentChain.filter(k => !unlockedState[k]) : currentChain;

            const targetNode = RESEARCH_DB[key] || { name: key };

            const warpSummaryHeader = `
                <div style="background:#1e1b4b; border:1px solid #6b21a8; border-radius:8px; padding:0.85rem 1.1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                    <div>
                        <div style="font-size:0.95rem; font-weight:bold; color:#e9d5ff;">💜 Total Required Warp for ${targetNode.name}:</div>
                        <div style="font-size:0.8rem; color:#c7d2fe; margin-top:2px;">Sum of all sticky/permanent warp across target and ${currentChain.length - 1} prerequisite steps.</div>
                    </div>
                    <div style="font-size:1.3rem; font-weight:800; color:#c084fc; background:#090d16; padding:0.35rem 0.85rem; border-radius:6px; border:1px solid #a855f7;">
                        ${totalPathWarp} Warp
                    </div>
                </div>
            `;

            checklistContainer.innerHTML = warpSummaryHeader + displayChain.map((nodeKey, idx) => {
                const node = RESEARCH_DB[nodeKey] || { name: nodeKey, category: 'General' };
                const isChecked = !!unlockedState[nodeKey];
                const aspectsHtml = renderAspectList(node.aspects);
                const aspectCostsHtml = node.aspect_costs ? renderAspectList(node.aspect_costs) : '';

                return `
                    <div class="step-card ${isChecked ? 'completed' : ''}">
                        <div class="step-header">
                            <div class="step-title">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleNodeCheck('${nodeKey}')" style="width:18px; height:18px; cursor:pointer; accent-color:var(--check-done);">
                                <span>${idx + 1}. ${node.name}</span>
                                <span class="step-cat">${node.category}</span>
                                ${node.warp && node.warp !== '0' ? `<span class="warp-badge">Warp +${node.warp}</span>` : ''}
                            </div>
                        </div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">Key: <code>${nodeKey}</code></div>
                        ${node.scans && node.scans.length > 0 ? `<div class="scans-box">🔍 <strong>Required Scans:</strong> ${node.scans.join(', ')}</div>` : ''}
                        ${node.aspects && node.aspects !== 'None' ? `<div><strong>Minigame Starting Aspects:</strong> ${aspectsHtml}</div>` : ''}
                        ${aspectCostsHtml ? `<div><strong>Aspect Point Costs:</strong> ${aspectCostsHtml}</div>` : ''}
                    </div>
                `;
            }).join('');

            // Render Scans Tab
            const scansContainer = document.getElementById('scans-container');
            const allScans = [];
            currentChain.forEach(k => {
                if (RESEARCH_DB[k]?.scans) allScans.push(...RESEARCH_DB[k].scans);
            });
            const uniqueScans = [...new Set(allScans)].sort();

            scansContainer.innerHTML = `
                <h3 style="font-size:1.1rem; color:var(--accent); margin-bottom:1rem;">All Scans Required Along Path (${uniqueScans.length})</h3>
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                    ${uniqueScans.length > 0 
                        ? uniqueScans.map(s => `<div style="background:var(--panel); padding:0.6rem; border-radius:6px;">🔍 [ ] ${s}</div>`).join('')
                        : '<div style="color:var(--text-muted);">No object scans required along this path.</div>'}
                </div>
            `;

            diagramNeedsRender = true;
            // Only render diagram immediately if diagram tab is active
            const isDiagramTabActive = document.getElementById('tab-diagram').classList.contains('active');
            if (isDiagramTabActive) {
                renderMermaid(currentChain);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            document.getElementById(`btn-tab-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'diagram') {
                if (diagramNeedsRender) {
                    renderMermaid(currentChain);
                } else {
                    setTimeout(attachPanZoom, 50);
                }
            }
        }

        searchInput.addEventListener('input', (e) => populateSelect(e.target.value.toLowerCase().trim()));
        targetSelect.addEventListener('change', renderTarget);
        chkParentsOnly.addEventListener('change', renderTarget);
        chkHideDone.addEventListener('change', renderTarget);
        document.getElementById('btn-reset-progress').addEventListener('click', () => {
            if (confirm('Reset all checked research step checkboxes?')) {
                localStorage.removeItem('tc_unlocked_nodes');
                for (let k in unlockedState) delete unlockedState[k];
                renderTarget();
            }
        });

        renderTarget();
    </script>
</body>
</html>
